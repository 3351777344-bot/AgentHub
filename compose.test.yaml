# Independent project, no production volumes. Downgrades only target this disposable DB.
name: agenthub-p2-test
services:
  postgres:
    build:
      context: docker/postgres
    image: ${AGENTHUB_POSTGRES_IMAGE:-agenthub/postgres:17.12-vector0.8.7}
    environment:
      POSTGRES_DB: agenthub_p2_test
      POSTGRES_USER: agenthub_test
      POSTGRES_PASSWORD: ${AGENTHUB_TEST_DATABASE_PASSWORD:?Set a temporary test password}
    ports:
      - "127.0.0.1:${AGENTHUB_TEST_DATABASE_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "agenthub_test", "-d", "agenthub_p2_test"]
      interval: 2s
      timeout: 3s
      retries: 30
