[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agenthub"
version = "0.1.0"
description = "AgentHub AI agent platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.8,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<9",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "argon2-cffi>=25.1,<26",
    "httpx2>=2.16,<3",
    "pypdf>=6.21.4,<7",
    "pgvector>=0.4,<0.5",
    "python-multipart>=0.0.22,<0.1",
    "mcp==2.3.0",
    "jsonschema>=4.26,<5",
    "langgraph==1.2.21",
    "langgraph-checkpoint-postgres==3.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.26,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agenthub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicit access to real PostgreSQL and Redis"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true
