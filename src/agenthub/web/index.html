<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentHub · 控制台</title>
  <link rel="stylesheet" href="/console-assets/console.css">
  <script type="module" src="/console-assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主内容</a>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">A</span> AgentHub</div>
    <div id="account" hidden><span id="identity"></span><button id="logout" type="button">退出登录</button></div>
  </header>
  <div id="layout" class="layout">
    <aside id="sidebar" hidden>
      <nav id="nav" aria-label="控制台导航"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <div id="notice" role="status" hidden></div>
      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <div class="login-intro">
          <span class="mark large" aria-hidden="true">A</span>
          <h1 id="login-title">登录 AgentHub</h1>
          <p>在同一工作台使用知识库、运行 Agent，并检查执行结果。</p>
        </div>
        <form id="login-form" class="card" method="post">
          <h2>账号登录</h2>
          <label>用户名 <input name="username" autocomplete="username" required maxlength="64"></label>
          <label>密码 <input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
          <button type="submit" class="primary">登录</button>
        </form>
      </section>
      <div id="view" hidden></div>
    </main>
  </div>
  <noscript>请启用 JavaScript 以使用 AgentHub 控制台。</noscript>
</body>
</html>
