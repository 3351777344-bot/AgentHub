name: Regression

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cloud_evaluation:
        description: Run the paid P8 evaluation on public synthetic data
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cloud_evaluation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENTHUB_RUN_P2_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.27"
          enable-cache: false
      - run: uv sync --locked
      - run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked python -m compileall -q src migrations scripts tests
          uv audit --locked --python-platform linux
          uv build --no-sources
      - name: Validate packaged console
        run: |
          node --check scripts/verify_p9_browser.mjs
          for file in src/agenthub/web/assets/*.js; do node --check "$file"; done
          unzip -l dist/*.whl | grep 'agenthub/web/index.html'
      - name: Start disposable PostgreSQL
        run: |
          password="$(cat /proc/sys/kernel/random/uuid)"
          echo "::add-mask::$password"
          echo "AGENTHUB_TEST_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          AGENTHUB_TEST_DATABASE_PASSWORD="$password" docker compose -f compose.test.yaml up -d --build --wait
      - run: uv run --locked pytest -q
      - name: Run packaged Compose smoke and real Redis checks
        env:
          AGENTHUB_API_PORT: "18100"
          AGENTHUB_IMAGE: agenthub/agenthub:ci
        run: |
          export POSTGRES_PASSWORD="$(cat /proc/sys/kernel/random/uuid)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          trap 'docker compose -p agenthub-p10-ci down' EXIT
          docker compose -p agenthub-p10-ci config --quiet
          docker compose -p agenthub-p10-ci build api postgres
          docker compose -p agenthub-p10-ci up -d --no-build --wait --wait-timeout 120
          uv run --locked python scripts/verify_ops.py http://127.0.0.1:18100
          uv run --locked python scripts/verify_ops.py http://127.0.0.1:18100 --dependencies agenthub-p10-ci
      - if: ${{ always() && env.AGENTHUB_TEST_DATABASE_PASSWORD != '' }}
        run: docker compose -f compose.test.yaml down

  cloud-evaluation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_evaluation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENTHUB_RUN_P2_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.27"
          enable-cache: false
      - run: uv sync --locked
      - name: Start disposable PostgreSQL
        run: |
          password="$(cat /proc/sys/kernel/random/uuid)"
          echo "::add-mask::$password"
          echo "AGENTHUB_TEST_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          AGENTHUB_TEST_DATABASE_PASSWORD="$password" docker compose -f compose.test.yaml up -d --build --wait
      - name: Compare public evaluation runs
        env:
          AGENTHUB_RUN_P8_CLOUD_ACCEPTANCE: "1"
          AGENTHUB_MODEL_BASE_URL: ${{ vars.AGENTHUB_MODEL_BASE_URL }}
          AGENTHUB_MODEL_NAME: ${{ vars.AGENTHUB_MODEL_NAME }}
          AGENTHUB_MODEL_API_KEY: ${{ secrets.AGENTHUB_MODEL_API_KEY }}
          AGENTHUB_EMBEDDING_BASE_URL: ${{ vars.AGENTHUB_EMBEDDING_BASE_URL }}
          AGENTHUB_EMBEDDING_MODEL: ${{ vars.AGENTHUB_EMBEDDING_MODEL }}
          AGENTHUB_EMBEDDING_API_KEY: ${{ secrets.AGENTHUB_EMBEDDING_API_KEY }}
        run: uv run --locked pytest tests/test_evaluations_integration.py -k real_cloud -q -rP
      - if: ${{ always() && env.AGENTHUB_TEST_DATABASE_PASSWORD != '' }}
        run: docker compose -f compose.test.yaml down
