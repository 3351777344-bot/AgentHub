name: agenthub

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTHUB_ENVIRONMENT: local
      AGENTHUB_LOG_LEVEL: ${AGENTHUB_LOG_LEVEL:-INFO}
      AGENTHUB_DATABASE_HOST: postgres
      AGENTHUB_DATABASE_NAME: agenthub
      AGENTHUB_DATABASE_USER: agenthub
      AGENTHUB_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_DEPENDENCY_TIMEOUT_SECONDS: 3
      AGENTHUB_SESSION_TTL_SECONDS: ${AGENTHUB_SESSION_TTL_SECONDS:-3600}
      AGENTHUB_DATABASE_POOL_SIZE: ${AGENTHUB_DATABASE_POOL_SIZE:-5}
      AGENTHUB_MODEL_BASE_URL: ${AGENTHUB_MODEL_BASE_URL:-}
      AGENTHUB_MODEL_API_KEY: ${AGENTHUB_MODEL_API_KEY:-}
      AGENTHUB_MODEL_NAME: ${AGENTHUB_MODEL_NAME:-}
      AGENTHUB_MODEL_TIMEOUT_SECONDS: ${AGENTHUB_MODEL_TIMEOUT_SECONDS:-60}
      AGENTHUB_MODEL_MAX_TOKENS: ${AGENTHUB_MODEL_MAX_TOKENS:-1024}
      AGENTHUB_MODEL_CONTEXT_CHARACTERS: ${AGENTHUB_MODEL_CONTEXT_CHARACTERS:-24000}
      AGENTHUB_MODEL_INCLUDE_USAGE: ${AGENTHUB_MODEL_INCLUDE_USAGE:-false}
      AGENTHUB_MODEL_THINKING_MODE: ${AGENTHUB_MODEL_THINKING_MODE:-provider_default}
      AGENTHUB_EMBEDDING_BASE_URL: ${AGENTHUB_EMBEDDING_BASE_URL:-}
      AGENTHUB_EMBEDDING_API_KEY: ${AGENTHUB_EMBEDDING_API_KEY:-}
      AGENTHUB_EMBEDDING_MODEL: ${AGENTHUB_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      AGENTHUB_EMBEDDING_DIMENSIONS: ${AGENTHUB_EMBEDDING_DIMENSIONS:-1024}
      AGENTHUB_EMBEDDING_TIMEOUT_SECONDS: ${AGENTHUB_EMBEDDING_TIMEOUT_SECONDS:-30}
      AGENTHUB_EMBEDDING_BATCH_SIZE: ${AGENTHUB_EMBEDDING_BATCH_SIZE:-10}
      AGENTHUB_EMBEDDING_MAX_CHARACTERS: ${AGENTHUB_EMBEDDING_MAX_CHARACTERS:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 15s

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/010-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
